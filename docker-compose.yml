services:
  backend:
    build:
      context: ./demo
      dockerfile: Dockerfile
    container_name: capital-ledger-backend
    ports:
      - "8082:8082"

  frontend:
    build:
      context: ./front
      dockerfile: Dockerfile
    container_name: capital-ledger-frontend
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8082/api
    depends_on:
      - backend